name: Continuous Delivery
on:
  push:
    branches:
      - main

jobs:
  deliver:
    runs-on: ubuntu-latest   # Define o ambiente de execução (máquina virtual Ubuntu)

    steps:
      # Etapa 1: Faz o checkout do código do repositório
      - name: Simulando Continuous Delivery
        uses: actions/upload-artifact@v7
        with:
          name: projetozipado.zip
          path: |
            **/*.py
            README.md
