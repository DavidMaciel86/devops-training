name: Continuous Delivery
on:
  push:
    branches:
      - main

jobs:
  deliver:
    runs-on: ubuntu-latest   # Define o ambiente de execução (máquina virtual Ubuntu)

    steps:
          # Etapa 1: Faz o checkout do código do repositório
          - name: Check out repository code
            uses: actions/checkout@v4

          # Etapa 2: Simula o processo de Continuous Delivery
          - name: Simulando Continuous Delivery
            uses: actions/upload-artifact@v7
            with:
              name: projetozipado.zip
              path: |
                **/*.py
                README.md

  deploy:
    runs-on: ubunto-latest
    needs: deliver  # Configura a necessidade do deliver antes de executar o deploy
    steps:
      - name: Simulando Deployment
        uses: actions/download-artifact@v8
        with:
          name: projetozipado
      - name: Display structure of downloaded files
        run: ls -R
