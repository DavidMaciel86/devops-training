# Nome do workflow que aparecerá nas execuções do GitHub Actions
name: CI Continuous Integration

# Define quando o workflow será executado
on:
  pull_request:              # Aciona o workflow em pull requests
    branches:
      - main                 # Limita a execução apenas para a branch 'main'

jobs:
  build:
    runs-on: ubuntu-latest   # Define o ambiente de execução (máquina virtual Ubuntu)

    steps:
      # Etapa 1: Faz o checkout do código do repositório
      - name: Check out repository code
        uses: actions/checkout@v6

      # Etapa 2: Executa a ação de lint para verificar a qualidade do código Python
      - name: Python Lint Code Scanning Action
        uses: advanced-security/python-lint-code-scanning-action@v1.1.3
        with:
          linter: pylint     # Define o linter que será usado (pylint)

  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Executar testes
        run: |
          # Executa os testes com pytest e exibe cada teste individualmente
          # Gera um relatório dos resultados no formato JUnit XML
          # Mede a cobertura dos testes sobre o código da pasta src
          # Mostra no terminal quais linhas não foram cobertas
          # Gera também relatórios de cobertura em XML e HTML
          python -m pytest -v \
            --junitxml=junit/test-results.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html
